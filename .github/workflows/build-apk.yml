name: Build Play Area APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PlayArea-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package full source
        run: tar -czf PlayArea-source.tar.gz --exclude=.git --exclude=.gradle --exclude='*/build' .
      - uses: actions/upload-artifact@v4
        with:
          name: PlayArea-source
          path: PlayArea-source.tar.gz
          if-no-files-found: error
          retention-days: 14
